<div class="calculator">
  <div class="calculator-header">
    🧮 Kalkulačka
  </div>
  
  <div class="calculator-display">
    {{display()}}
  </div>
  
  <div class="calculator-buttons">
    <!-- Riadok 1 - Špeciálne funkcie -->
    <button class="btn-special" (click)="clear()">C</button>
    <button class="btn-special" (click)="backspace()">⌫</button>
    <button class="btn-special" (click)="factorial()">n!</button>
    <button class="btn-operator" (click)="performOperation('^')">x^y</button>

    <!-- Riadok 2 - Čísla 7-9 -->
    <button class="btn-number" (click)="inputDigit('7')">7</button>
    <button class="btn-number" (click)="inputDigit('8')">8</button>
    <button class="btn-number" (click)="inputDigit('9')">9</button>
    <button class="btn-operator" (click)="performOperation('÷')">÷</button>

    <!-- Riadok 3 - Čísla 4-6 -->
    <button class="btn-number" (click)="inputDigit('4')">4</button>
    <button class="btn-number" (click)="inputDigit('5')">5</button>
    <button class="btn-number" (click)="inputDigit('6')">6</button>
    <button class="btn-operator" (click)="performOperation('×')">×</button>

    <!-- Riadok 4 - Čísla 1-3 -->
    <button class="btn-number" (click)="inputDigit('1')">1</button>
    <button class="btn-number" (click)="inputDigit('2')">2</button>
    <button class="btn-number" (click)="inputDigit('3')">3</button>
    <button class="btn-operator" (click)="performOperation('-')">-</button>

    <!-- Riadok 5 - 0, bodka, rovná sa -->
    <button class="btn-number" (click)="inputDigit('0')">0</button>
    <button class="btn-number" (click)="inputDecimal()">.</button>
    <button class="btn-special" (click)="sqrt()">√</button>
    <button class="btn-operator" (click)="performOperation('+')">+</button>

    <!-- Riadok 6 - Equals -->
    <button class="btn-equals" (click)="equals()">=</button>
  </div>
</div>
